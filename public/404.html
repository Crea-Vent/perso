<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Mon budget</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so a direct load or refresh
      // on a route like /perso/budget hits this 404 page. Encode the path
      // into a query string and redirect to index.html, which decodes it
      // back before React Router mounts (see the script in index.html).
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
